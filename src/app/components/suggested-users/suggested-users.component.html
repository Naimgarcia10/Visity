<div class="suggestions-container">
  <h3 class="suggestions-title">👥 Usuarios que te podrían interesar</h3>

  <div *ngFor="let user of suggestions" class="suggestion-card">
    <a [routerLink]="['/profile', user.username]" class="profile-link">
      <img [src]="user.profilePic" alt="Foto perfil" class="profile-pic" />
    </a>
    <div class="user-info">
      <a [routerLink]="['/profile', user.username]" class="author-id">
        <p class="username"><strong>{{ user.username }}</strong></p>
      </a>
      <p class="match-score">🎯 Coincidencia: {{ user.matchScore }}</p>
    </div>
    
    <button *ngIf="!user.isFollowed" class="follow-btn" (click)="follow(user.username, user)">Seguir</button>
    <button *ngIf="user.isFollowed" class="unfollow-btn" (click)="unfollow(user.username, user)">Dejar de seguir</button>

  <div *ngIf="!loading && suggestions.length === 0" class="no-suggestions">
    <p>No hay sugerencias en este momento.</p>
  </div>
</div>
