<div class="create-post-container">
  <form [formGroup]="postForm" (ngSubmit)="submitPost()">
    
    <!-- Sección de texto principal -->
    <div class="form-section">
      <h3>Información principal</h3>
      <label for="text">Describe tu experiencia:</label>
      <textarea id="text" formControlName="text" rows="4" placeholder="Comparte tu experiencia de viaje..."></textarea>
      <div *ngIf="postForm.get('text')?.invalid && postForm.get('text')?.touched" class="error">
        <span *ngIf="postForm.get('text')?.hasError('required')">El texto es obligatorio.</span>
        <span *ngIf="postForm.get('text')?.hasError('maxLength')">El texto no puede exceder los 500 caracteres.</span>
      </div>
      
      <label for="image">Fotos del viaje (máximo 10):</label>
      <input type="file" id="image" multiple (change)="onImageUpload($event)">
      
      <div class="carousel" *ngIf="imageFiles.length > 0">
        <button class="prev-btn" *ngIf="imageFiles.length >= 2" (click)="prevImage()" [disabled]="currentImageIndex === 0">‹</button>

        <img class="carousel-image" [src]="imageFiles.length ? (imageFiles[currentImageIndex] | fileToUrl) : null" alt="Vista previa" />

        <button class="next-btn" *ngIf="imageFiles.length >= 2" (click)="nextImage()" [disabled]="currentImageIndex === imageFiles.length - 1">›</button>

        <div class="carousel-indicators" *ngIf="imageFiles.length >= 2">
          <span *ngFor="let file of imageFiles; let i = index"
                [class.active]="i === currentImageIndex"
                (click)="currentImageIndex = i"></span>
        </div>
      </div>
    </div>
    <!-- Sección de categorización -->
    <div class="form-section">
      <h3>Categoriza tu viaje</h3>
      
      <label>Tipo de Viaje:</label>
      <div class="tag-options">
        <div class="tag-option" *ngFor="let tag of tags.tipoViaje">
          <input type="checkbox" [id]="'tipo-' + tag.label" [value]="tag.label" (change)="onCheckboxChange('tipoViaje', $event)"> 
          <label [for]="'tipo-' + tag.label">{{ tag.label }}</label>
        </div>
      </div>
      
      <label>Presupuesto:</label>
      <div class="tag-options">
        <div class="tag-option" *ngFor="let tag of tags.presupuesto">
          <input type="radio" [id]="'presupuesto-' + tag.label" name="presupuesto" [value]="tag.label" 
                (change)="onRadioChange('presupuesto', tag.label)"> 
          <label [for]="'presupuesto-' + tag.label">{{ tag.label }}</label>
        </div>
      </div>
      
      <label>Clima:</label>
      <div class="tag-options">
        <div class="tag-option" *ngFor="let tag of tags.clima">
          <input type="radio" [id]="'clima-' + tag.label" name="clima" [value]="tag.label" 
                (change)="onRadioChange('clima', tag.label)"> 
          <label [for]="'clima-' + tag.label">{{ tag.label }}</label>
        </div>
      </div>
    </div>
    
    <!-- Sección de itinerario -->
    <div class="form-section" *ngIf="itinerarioFinalizado === false">
      <h3>Crea tu itinerario</h3>
      
      <div class="map-container" id="map"></div>
      
      <div class="search-container" ngSkipHydration>
        <input id="search-bar" type="text" placeholder="Buscar destino..." />
        <button type="button" (click)="finalizarItinerario()">Añadir destino</button>
      </div>
      
      <div class="itinerary-preview" *ngIf="waypoints.length > 0">
        <h3>Destinos añadidos:</h3>
        <ul>
          <li *ngFor="let destino of waypoints">{{ destino.name }}</li>
        </ul>
        <button type="button" (click)="finalizarItinerarioYGenerarImagen()">Finalizar Itinerario</button>
      </div>
    </div>
    
    <!-- Previsualización del itinerario finalizado -->
    <div class="form-section" *ngIf="itinerarioFinalizado">
      <h3>Itinerario finalizado</h3>
      <div class="image-preview" *ngIf="itinerarioImagenUrl">
        <img [src]="itinerarioImagenUrl" alt="Itinerario">
      </div>
      <p *ngIf="googleMapsUrl">
        <a [href]="googleMapsUrl" target="_blank">Ver en Google Maps</a>
      </p>
    </div>
    
    <!-- Mensaje de estado -->
    <div class="status-message" [class.success]="showStatusMessage" *ngIf="showStatusMessage">
      {{ statusMessage }}
    </div>
    
    <!-- Botones de acción -->
    <div class="action-buttons">
      <button type="button" class="secondary-button" (click)="resetFormAndStates()">Cancelar</button>
      <button type="submit" class="primary-button" [disabled]="postForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Publicando...' : 'Publicar' }}
      </button>
    </div>
    
  </form>
</div>
